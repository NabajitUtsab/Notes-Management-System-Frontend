<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Notis</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="login.html" class="auth-logo">Noti<span>s</span></a>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Start capturing your thoughts</p>

    <div class="form-group">
      <label class="form-label" for="name">Username</label>
      <input class="form-input" id="name" type="text" placeholder="Choose a username" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" id="password" type="password" placeholder="Create a password" autocomplete="new-password">
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;" onclick="register()">
      Create account →
    </button>

    <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>
<script src="./js/script.js"></script>
</body>
</html>
