<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Notis</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <a href="login.html" class="auth-logo">Noti<span>s</span></a>

        <!-- Role toggle -->
        <div class="role-toggle">
            <button class="role-btn active-user" id="btn-user"  onclick="setRole('user')">👤 User</button>
            <button class="role-btn"             id="btn-admin" onclick="setRole('admin')">🛡 Admin</button>
        </div>

        <h1 class="auth-title" id="login-title">Welcome back</h1>
        <p class="auth-subtitle" id="login-sub">Sign in to your notes</p>

        <div class="form-group">
            <label class="form-label" for="name">Username</label>
            <input class="form-input" id="name" type="text" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" id="password" type="password" placeholder="Enter password" autocomplete="current-password">
        </div>

        <button class="btn btn-primary" id="login-btn"
                style="width:100%;justify-content:center;padding:13px;"
                onclick="login()">
            Sign in →
        </button>

        <p class="auth-footer" id="login-footer">
            No account? <a href="register.html">Create one</a>
        </p>
    </div>
</div>
<script src="./js/script.js"></script>
</body>
</html>
